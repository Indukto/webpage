<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>indukto — Apps &amp; Code</title>
  <meta name="description" content="indukto — Android apps on Google Play and open-source projects on GitHub." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='black'/%3E%3Cpath d='M56 12 L26 56 h18 l-6 32 30-44 h-18 z' fill='white'/%3E%3C/svg%3E" />
  <style>
    :root {
      --ink: #111111;
      --paper: #fafafa;
      --gray: #8a8a8a;
      --bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      --spring: cubic-bezier(0.2, 0.9, 0.3, 1.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif;
      background:
        repeating-linear-gradient(0deg, transparent 0 31px, #e9e9e9 31px 32px),
        repeating-linear-gradient(90deg, transparent 0 31px, #e9e9e9 31px 32px),
        var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
    }

    .card {
      background: #fff;
      border: 4px solid var(--ink);
      border-radius: 32px;
      padding: 3rem 2.25rem 2.25rem;
      max-width: 430px;
      width: 100%;
      text-align: center;
      box-shadow: 10px 10px 0 var(--ink);
      position: relative;
    }

    .avatar {
      width: 104px;
      height: 104px;
      border-radius: 30px;
      background: var(--ink);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      margin: 0 auto 1.4rem;
      border: 4px solid var(--ink);
      box-shadow: 6px 6px 0 #d5d5d5;
      transform: rotate(-6deg);
      transition: transform 0.3s var(--spring);
    }

    .avatar:hover {
      transform: rotate(0deg) scale(1.05);
    }

    h1 {
      font-size: 2.6rem;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      line-height: 1;
    }

    .tagline {
      font-family: "Courier New", monospace;
      font-size: 0.9rem;
      color: var(--gray);
      margin: 0.7rem 0 2.2rem;
      letter-spacing: 0.5px;
    }

    .links {
      display: grid;
      gap: 1.1rem;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 1rem;
      text-decoration: none;
      color: var(--ink);
      background: #fff;
      border: 4px solid var(--ink);
      border-radius: 24px;
      padding: 1rem 1.2rem;
      box-shadow: 6px 6px 0 var(--ink);
      transition: transform 0.25s var(--bounce), box-shadow 0.25s var(--bounce), background 0.15s ease;
    }

    .link:hover {
      transform: translate(-3px, -3px) scale(1.02);
      box-shadow: 12px 12px 0 var(--ink);
      background: #f2f2f2;
    }

    .link:active {
      transform: translate(4px, 4px) scale(0.99);
      box-shadow: 2px 2px 0 var(--ink);
    }

    .link .icon {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: var(--ink);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 1.2rem;
      font-family: Arial, sans-serif;
      border: 3px solid var(--ink);
    }

    .link .icon.play { box-shadow: inset 0 0 0 3px #fff; }
    .link .icon.play::before { content: "▶"; transform: translateX(1px); }
    .link .icon.github svg { width: 26px; height: 26px; fill: #fff; }

    .link .meta { text-align: left; min-width: 0; }

    .link .meta .name {
      font-weight: 900;
      font-size: 1.05rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: block;
    }

    .link .meta .desc {
      font-family: "Courier New", monospace;
      color: var(--gray);
      font-size: 0.8rem;
      display: block;
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    footer {
      margin-top: 2.2rem;
      font-family: "Courier New", monospace;
      font-size: 0.75rem;
      color: var(--gray);
    }

    @media (max-width: 480px) {
      .card { padding: 2.25rem 1.5rem 1.75rem; box-shadow: 7px 7px 0 var(--ink); }
      .link { box-shadow: 5px 5px 0 var(--ink); }
      .link:hover { box-shadow: 9px 9px 0 var(--ink); }
      h1 { font-size: 2.1rem; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar">
      <svg viewBox="0 0 16 16" width="52" height="52" aria-hidden="true">
        <path d="M11 1 L4 11 H8 L6 15 L12 6 H9 Z" fill="#fff"/>
      </svg>
    </div>
    <h1>indukto</h1>
    <p class="tagline">// Android apps &amp; open-source experiments</p>

    <nav class="links">
      <a class="link" href="https://play.google.com/store/apps/dev?id=YOUR_DEV_ID" target="_blank" rel="noopener">
        <span class="icon play"></span>
        <span class="meta">
          <span class="name">Google Play</span>
          <span class="desc">Browse all my apps</span>
        </span>
      </a>

      <a class="link" href="https://github.com/Indukto" target="_blank" rel="noopener">
        <span class="icon github">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
          </svg>
        </span>
        <span class="meta">
          <span class="name">GitHub</span>
          <span class="desc">Check out my projects</span>
        </span>
      </a>
    </nav>

    <footer>© <span id="year"></span> indukto</footer>
  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
