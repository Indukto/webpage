  <style>
    @font-face {

    }

    @font-face {
      font-family: 'LibreBarcode128';
      src: url('LibreBarcode128Text-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Bitcount Single';
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url('bitcount-single-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    @font-face {
      font-family: 'Bitcount Single';
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url('bitcount-single-latinext.woff2') format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }

    :root {
      --pixel: "Press Start 2P", "Courier New", monospace;
      --term: "VT323", "Courier New", monospace;
      --bitcount: "Bitcount Single", monospace;
      --barcode: "LibreBarcode128", monospace;
      --step: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      scroll-snap-type: y mandatory;
      overscroll-behavior-y: none;
    }

    body {
      font-family: var(--bitcount);
      background-color: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 0;
      position: relative;
      overflow-x: hidden;
    }

    /* the photo itself, used directly as the background */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #000 no-repeat center / cover;
      filter: grayscale(1) contrast(1.1) brightness(1.05);
      pointer-events: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, transparent 50%, rgba(0,0,0,0.4) 100%);
      z-index: 0;
      pointer-events: none;
    }

    /* CRT scanlines over everything */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 5;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.035) 0px,
        rgba(255,255,255,0.035) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
    }


    

    .pixel-corners {
      clip-path: polygon(
        0 var(--step), calc(var(--step) / 2) var(--step), calc(var(--step) / 2) calc(var(--step) / 2), var(--step) calc(var(--step) / 2), var(--step) 0,
        calc(100% - var(--step)) 0, calc(100% - var(--step)) calc(var(--step) / 2), calc(100% - var(--step) / 2) calc(var(--step) / 2), calc(100% - var(--step) / 2) var(--step), 100% var(--step),
        100% calc(100% - var(--step)), calc(100% - var(--step) / 2) calc(100% - var(--step)), calc(100% - var(--step) / 2) calc(100% - var(--step) / 2), calc(100% - var(--step)) calc(100% - var(--step) / 2), calc(100% - var(--step)) 100%,
        var(--step) 100%, var(--step) calc(100% - var(--step) / 2), calc(var(--step) / 2) calc(100% - var(--step) / 2), calc(var(--step) / 2) calc(100% - var(--step)), 0 calc(100% - var(--step))
      );
    }

    .card {
      background-color: #111;
      background-image:
        radial-gradient(circle at center, #1a1a1a 1px, transparent 1px);
      background-size: 6px 6px;
      border: none;
      border-radius: 18px;
      padding: 2.5rem 2.25rem 2rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      filter: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255,255,255,0.06);
      overflow: hidden;
    }

    .ascii {
      font-family: var(--term);
      font-size: 14px;
      line-height: 1.05;
      color: #fff;
      margin: 0 auto 1.5rem;
      text-align: center;
      user-select: none;
    }

    h1 {
      font-family: var(--barcode);
      font-size: 58px;
      font-weight: 400;
      letter-spacing: 3px;
      line-height: 1.9;
      color: #fff;
      text-shadow:
        3px 3px 0 #3a3a3a,
        0 0 18px rgba(255, 255, 255, 0.35),
        0 0 45px rgba(255, 255, 255, 0.15);
      animation: glow 3.5s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% {
        text-shadow:
          3px 3px 0 #3a3a3a,
          0 0 18px rgba(255, 255, 255, 0.35),
          0 0 45px rgba(255, 255, 255, 0.15);
      }
      50% {
        text-shadow:
          3px 3px 0 #3a3a3a,
          0 0 22px rgba(255, 255, 255, 0.45),
          0 0 55px rgba(255, 255, 255, 0.28),
          0 0 90px rgba(255, 255, 255, 0.12);
      }
    }    .tagline {
      font-family: var(--bitcount);
      font-size: 22px;
      line-height: 1.7;
      color: #bdbdbd;
      margin: 0.5rem 0 2.25rem;
      letter-spacing: 0.5px;
      min-height: 2.2em;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.45);
    }

    .tagline .prompt { color: #fff; }

    .cursor {
      display: inline-block;
      color: #fff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.75);
      animation: blink 1s steps(2, start) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .links {
      display: grid;
      gap: 1.25rem;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 1rem;
      text-decoration: none;
      background: #1a1a1a;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 12px;
      padding: 1rem 1.1rem;
      filter: none;
      transition: transform 0.2s ease, background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }

    .link:hover {
      transform: translateY(-2px);
      background: #fff;
      border-color: #fff;
      color: #000;
      box-shadow: 0 0 20px rgba(255,255,255,0.35);
    }

    .link:active {
      transform: translateY(1px);
    }

    .link:focus-visible {
      outline: 3px dashed #fff;
      outline-offset: 4px;
    }

    .link .icon {
      width: 46px;
      height: 46px;
      background: #2a2a2a;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      transition: background-color 0.15s ease;
    }

    .link .icon svg {
      width: 24px;
      height: 24px;
      fill: #fff;
      display: block;
    }

    .link:hover .icon {
      background: #000;
      border-color: #000;
    }

    .link:hover .icon svg { fill: #fff; }

    .link .meta { text-align: left; min-width: 0; }

    .link .meta .name {
      font-family: var(--bitcount);
      font-size: 24px;
      line-height: 1.9;
      letter-spacing: 1px;
      display: block;
      color: inherit;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.45);
    }

    .link .meta .desc {
      font-family: var(--bitcount);
      font-size: 14px;
      line-height: 1.3;
      color: #888;
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: color 0.15s ease;
      text-shadow: 0 0 9px rgba(255, 255, 255, 0.3);
    }

    .link:hover .meta .desc { color: #333; }

    .projects {
      margin-top: 2.5rem;
      text-align: left;
    }

    .projects-title {
      font-family: var(--term);
      font-size: 20px;
      color: #9a9a9a;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.25);
    }

    .projects-title .prompt { color: #fff; }

    .proj {
      display: block;
      text-decoration: none;
      color: #fff;
      padding: 0.65rem 0.1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      transition: border-color 0.15s ease, padding-left 0.15s ease;
    }

    .proj:last-child { border-bottom: none; }

    .proj-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.5rem;
    }

    .proj-name {
      font-family: var(--bitcount);
      font-size: 16px;
      letter-spacing: 0.5px;
      text-shadow: 0 0 9px rgba(255, 255, 255, 0.3);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .proj-stars {
      font-family: var(--bitcount);
      font-size: 13px;
      color: #888;
      flex-shrink: 0;
      text-shadow: 0 0 7px rgba(255, 255, 255, 0.2);
    }

    .proj-desc {
      font-family: var(--bitcount);
      font-size: 13px;
      color: #777;
      display: block;
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-shadow: 0 0 7px rgba(255, 255, 255, 0.15);
    }

    .proj:hover {
      border-color: rgba(255, 255, 255, 0.35);
      padding-left: 0.4rem;
    }

    .proj:hover .proj-name { color: #fff; }
    .proj:hover .proj-desc { color: #bbb; }

    footer {
      margin-top: 2.25rem;
      font-family: var(--bitcount);
      font-size: 18px;
      line-height: 1.6;
      color: #7a7a7a;
      letter-spacing: 1px;
      text-shadow: 0 0 9px rgba(255, 255, 255, 0.28);
    }

    footer .brand {
      font-family: var(--term);
    }

    footer .ver { color: #5c5c5c; }

    /* full-screen photo slides */
    .gallery {
      width: 100%;
      display: block;
    }

    .frame {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
      background: #000;
      overflow: hidden;
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }

    .frame picture {
      display: block;
      width: 100%;
      height: 100%;
    }

    .frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: grayscale(1) contrast(1.05);
    }

    .frame-label {
      position: absolute;
      left: 1.25rem;
      bottom: 1.1rem;
      font-family: var(--term);
      font-size: 24px;
      color: #ddd;
      letter-spacing: 1px;
      text-shadow: 0 0 9px rgba(0, 0, 0, 0.85);
    }

    .frame-info {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      max-width: 400px;
      padding: 1.75rem 1.5rem;
      background: rgba(10, 10, 10, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }

    .frame-info h2 {
      font-family: var(--barcode);
      font-size: 40px;
      font-weight: 400;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 0 18px rgba(255, 255, 255, 0.35);
    }

    .frame-info p {
      font-family: var(--bitcount);
      font-size: 16px;
      line-height: 1.6;
      color: #bdbdbd;
      margin-top: 0.5rem;
      text-shadow: 0 0 9px rgba(255, 255, 255, 0.25);
    }

    .frame-info a {
      display: inline-block;
      margin-top: 1rem;
      font-family: var(--bitcount);
      font-size: 14px;
      letter-spacing: 1px;
      color: #fff;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 10px;
      padding: 0.5rem 0.9rem;
      transition: background-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }

    .frame-info a:hover {
      background: #fff;
      color: #000;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.35);
    }

    @media (max-width: 480px) {
      .corner { display: none; }
      .card { padding: 1.75rem 1.1rem 1.5rem; max-width: calc(100vw - 2.5rem); }
      .link {
        gap: 0.75rem;
        padding: 0.85rem 0.85rem;
      }
      .link .icon { width: 40px; height: 40px; }
      .link .icon svg { width: 20px; height: 20px; }
      .link .meta .name { font-size: 20px; }
      .link .meta .desc { font-size: 13px; }
      h1 { font-size: 24px; }
      .ascii { font-size: 10.5px; }
      .tagline { font-size: 18px; }
    }
  </style>
</head>
<body>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    // terminal-style typewriter for the tagline
    const text = "android apps & open-source experiments";
    const el = document.getElementById("type");
    let i = 0;
    (function tick() {
      if (i <= text.length) {
        el.textContent = text.slice(0, i++);
        setTimeout(tick, 45);
      }
    })();

    // github projects — static list, no external requests (Datenschutz)
    const projList = document.getElementById("proj-list");
    const FALLBACK_PROJECTS = [
      { name: "zoom-box", html_url: "https://github.com/Indukto/zoom-box", description: "Android camera with Zoombox", language: "Kotlin", stargazers_count: 5 },
      { name: "TvGarden", html_url: "https://github.com/Indukto/TvGarden", description: null, language: "Kotlin", stargazers_count: 2 },
      { name: "gpro", html_url: "https://github.com/Indukto/gpro", description: "local llm asistant", language: "TypeScript", stargazers_count: 0 },
      { name: "sony-liveview-usb", html_url: "https://github.com/Indukto/sony-liveview-usb", description: null, language: "Java", stargazers_count: 0 },
      { name: "FaceSimilarityEngine", html_url: "https://github.com/Indukto/FaceSimilarityEngine", description: null, language: "Python", stargazers_count: 0 }
    ];

    function renderProjects(repos) {
      projList.innerHTML = "";
      repos.forEach(r => {
        const a = document.createElement("a");
        a.className = "proj";
        a.href = r.html_url;
        a.target = "_blank";
        a.rel = "noopener";

        const top = document.createElement("span");
        top.className = "proj-top";

        const name = document.createElement("span");
        name.className = "proj-name";
        name.textContent = r.name;
        top.appendChild(name);

        if (r.stargazers_count > 0) {
          const stars = document.createElement("span");
          stars.className = "proj-stars";
          stars.textContent = "\u2605 " + r.stargazers_count;
          top.appendChild(stars);
        }
        a.appendChild(top);

        const desc = r.description || (r.language ? r.language.toLowerCase() : "");
        if (desc) {
          const d = document.createElement("span");
          d.className = "proj-desc";
          d.textContent = desc;
          a.appendChild(d);
        }
        projList.appendChild(a);
      });
    }

    renderProjects(FALLBACK_PROJECTS);

    // The photo is used directly as the background — no re-dithering.
