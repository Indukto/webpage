<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>indukto — Apps &amp; Code</title>
  <meta name="description" content="indukto — Android apps on Google Play and open-source projects on GitHub." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='black'/%3E%3Cpath d='M56 12 L26 56 h18 l-6 32 30-44 h-18 z' fill='white'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <style>
    :root {
      --pixel: "Press Start 2P", "Courier New", monospace;
      --term: "VT323", "Courier New", monospace;
      --step: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--term);
      background-color: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      position: relative;
    }

    /* the photo itself, used directly as the background */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #000 no-repeat center / cover;
      filter: grayscale(1) contrast(1.2) brightness(1.1);
      pointer-events: none;
    }

    /* Terminal corner brackets */
    .corner {
      position: fixed;
      font-family: var(--term);
      font-size: 24px;
      line-height: 1;
      color: #3d3d3d;
      z-index: 6;
      pointer-events: none;
      user-select: none;
    }
    

    .pixel-corners {
      clip-path: polygon(
        0 var(--step), calc(var(--step) / 2) var(--step), calc(var(--step) / 2) calc(var(--step) / 2), var(--step) calc(var(--step) / 2), var(--step) 0,
        calc(100% - var(--step)) 0, calc(100% - var(--step)) calc(var(--step) / 2), calc(100% - var(--step) / 2) calc(var(--step) / 2), calc(100% - var(--step) / 2) var(--step), 100% var(--step),
        100% calc(100% - var(--step)), calc(100% - var(--step) / 2) calc(100% - var(--step)), calc(100% - var(--step) / 2) calc(100% - var(--step) / 2), calc(100% - var(--step)) calc(100% - var(--step) / 2), calc(100% - var(--step)) 100%,
        var(--step) 100%, var(--step) calc(100% - var(--step) / 2), calc(var(--step) / 2) calc(100% - var(--step) / 2), calc(var(--step) / 2) calc(100% - var(--step)), 0 calc(100% - var(--step))
      );
    }

    .card {
      background: #000;
      border: 3px solid #fff;
      border-radius: 4px;
      padding: 2.5rem 2.25rem 2rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      filter: drop-shadow(10px 10px 0 #fff);
      position: relative;
      z-index: 1;
    }

    .ascii {
      font-family: var(--term);
      font-size: 19px;
      line-height: 1.1;
      color: #fff;
      margin: 0 auto 1.5rem;
      width: fit-content;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.45);
      user-select: none;
    }

    h1 {
      font-family: var(--pixel);
      font-size: 21px;
      font-weight: 400;
      letter-spacing: 3px;
      line-height: 1.9;
      color: #fff;
      text-shadow: 3px 3px 0 #3a3a3a;
      animation: glow 3.5s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% { text-shadow: 3px 3px 0 #3a3a3a; }
      50% { text-shadow: 3px 3px 0 #3a3a3a, 0 0 14px rgba(255, 255, 255, 0.55); }
    }

    .tagline {
      font-family: var(--term);
      font-size: 21px;
      line-height: 1.7;
      color: #bdbdbd;
      margin: 0.5rem 0 2.25rem;
      letter-spacing: 0.5px;
      min-height: 2.2em;
    }

    .tagline .prompt { color: #fff; }

    .cursor {
      display: inline-block;
      color: #fff;
      animation: blink 1s steps(2, start) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .links {
      display: grid;
      gap: 1.25rem;
    }

    .link {
      --step: 6px;
      display: flex;
      align-items: center;
      gap: 1rem;
      text-decoration: none;
      background: #fff;
      color: #000;
      border: 3px solid #000;
      border-radius: 3px;
      padding: 1rem 1.1rem;
      filter: drop-shadow(5px 5px 0 #fff);
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.22s ease, background-color 0.15s ease;
    }

    /* invert on hover — like a CRT screen flip */
    .link:hover {
      transform: translate(-2px, -2px);
      filter: drop-shadow(8px 8px 0 #fff);
      background: #000;
      color: #fff;
      border-color: #fff;
    }

    .link:active {
      transform: translate(3px, 3px);
      filter: drop-shadow(0 0 0 #fff);
    }

    .link:focus-visible {
      outline: 3px dashed #fff;
      outline-offset: 4px;
    }

    .link .icon {
      --step: 4px;
      width: 46px;
      height: 46px;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 3px solid #000;
      border-radius: 2px;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .link .icon svg {
      width: 24px;
      height: 24px;
      fill: #fff;
      display: block;
      transition: fill 0.15s ease;
    }

    .link:hover .icon {
      background: #fff;
      border-color: #fff;
    }

    .link:hover .icon svg { fill: #000; }

    .link .meta { text-align: left; min-width: 0; }

    .link .meta .name {
      font-family: var(--pixel);
      font-size: 12px;
      line-height: 1.9;
      letter-spacing: 1px;
      display: block;
      color: inherit;
    }

    .link .meta .desc {
      font-family: var(--term);
      font-size: 20px;
      line-height: 1.3;
      color: #555;
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: color 0.15s ease;
    }

    .link:hover .meta .desc { color: #9a9a9a; }

    footer {
      margin-top: 2.25rem;
      font-family: var(--term);
      font-size: 18px;
      line-height: 1.6;
      color: #8a8a8a;
      letter-spacing: 1px;
    }

    footer .ver { color: #4d4d4d; }

    @media (max-width: 480px) {
      .corner { display: none; }
      .card { padding: 1.75rem 1.1rem 1.5rem; filter: drop-shadow(7px 7px 0 #fff); }
      .link {
        gap: 0.75rem;
        padding: 0.85rem 0.85rem;
        filter: drop-shadow(4px 4px 0 #fff);
      }
      .link:hover { filter: drop-shadow(6px 6px 0 #fff); }
      .link .icon { width: 40px; height: 40px; }
      .link .icon svg { width: 20px; height: 20px; }
      .link .meta .name { font-size: 10px; }
      .link .meta .desc { font-size: 18px; }
      h1 { font-size: 16px; }
      .ascii { font-size: 15px; }
      .tagline { font-size: 19px; }
    }
  </style>
</head>
