<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>indukto — Apps &amp; Code</title>
  <meta name="description" content="indukto — Android apps on Google Play and open-source projects on GitHub." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='black'/%3E%3Cpath d='M56 12 L26 56 h18 l-6 32 30-44 h-18 z' fill='white'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <style>
    :root {
      --pixel: "Press Start 2P", "Courier New", monospace;
      --term: "VT323", "Courier New", monospace;
      --step: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--term);
      background-color: #000;
      background-image: radial-gradient(circle, #1c1c1c 1.5px, transparent 1.5px);
      background-size: 26px 26px;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      position: relative;
    }

    /* CRT scanlines */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(255, 255, 255, 0.035) 0 1px,
        transparent 1px 3px
      );
      pointer-events: none;
      z-index: 5;
    }

    .pixel-corners {
      clip-path: polygon(
        0 var(--step), calc(var(--step) / 2) var(--step), calc(var(--step) / 2) calc(var(--step) / 2), var(--step) calc(var(--step) / 2), var(--step) 0,
        calc(100% - var(--step)) 0, calc(100% - var(--step)) calc(var(--step) / 2), calc(100% - var(--step) / 2) calc(var(--step) / 2), calc(100% - var(--step) / 2) var(--step), 100% var(--step),
        100% calc(100% - var(--step)), calc(100% - var(--step) / 2) calc(100% - var(--step)), calc(100% - var(--step) / 2) calc(100% - var(--step) / 2), calc(100% - var(--step)) calc(100% - var(--step) / 2), calc(100% - var(--step)) 100%,
        var(--step) 100%, var(--step) calc(100% - var(--step) / 2), calc(var(--step) / 2) calc(100% - var(--step) / 2), calc(var(--step) / 2) calc(100% - var(--step)), 0 calc(100% - var(--step))
      );
    }

    .card {
      background: #000;
      border: 3px solid #fff;
      border-radius: 4px;
      padding: 2.75rem 2.25rem 2.25rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      filter: drop-shadow(10px 10px 0 #fff);
      position: relative;
    }

    .ascii {
      font-family: var(--term);
      font-size: 19px;
      line-height: 1.15;
      color: #fff;
      margin: 0 auto 1.5rem;
      width: fit-content;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.45);
      user-select: none;
    }

    h1 {
      font-family: var(--pixel);
      font-size: 21px;
      font-weight: 400;
      letter-spacing: 3px;
      line-height: 1.9;
      color: #fff;
      text-shadow: 3px 3px 0 #3a3a3a;
    }

    .tagline {
      font-family: var(--term);
      font-size: 21px;
      line-height: 1.7;
      color: #bdbdbd;
      margin: 0.5rem 0 2.25rem;
      letter-spacing: 0.5px;
    }

    .cursor {
      display: inline-block;
      color: #fff;
      animation: blink 1s steps(2, start) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .links {
      display: grid;
      gap: 1.25rem;
    }

    .link {
      --step: 6px;
      display: flex;
      align-items: center;
      gap: 1rem;
      text-decoration: none;
      background: #fff;
      color: #000;
      border: 3px solid #000;
      border-radius: 3px;
      padding: 1rem 1.1rem;
      filter: drop-shadow(5px 5px 0 #fff);
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.22s ease;
    }

    .link:hover {
      transform: translate(-2px, -2px);
      filter: drop-shadow(8px 8px 0 #fff);
    }

    .link:active {
      transform: translate(3px, 3px);
      filter: drop-shadow(0 0 0 #fff);
    }

    .link .icon {
      --step: 4px;
      width: 46px;
      height: 46px;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 3px solid #000;
      border-radius: 2px;
    }

    .link .icon svg {
      width: 24px;
      height: 24px;
      fill: #fff;
      display: block;
    }

    .link .meta { text-align: left; min-width: 0; }

    .link .meta .name {
      font-family: var(--pixel);
      font-size: 12px;
      line-height: 1.9;
      letter-spacing: 1px;
      display: block;
      color: #000;
    }

    .link .meta .desc {
      font-family: var(--term);
      font-size: 20px;
      line-height: 1.3;
      color: #555;
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    footer {
      margin-top: 2.25rem;
      font-family: var(--term);
      font-size: 18px;
      line-height: 1.6;
      color: #8a8a8a;
      letter-spacing: 1px;
    }

    @media (max-width: 480px) {
      .card { padding: 2rem 1.25rem 1.75rem; filter: drop-shadow(7px 7px 0 #fff); }
      .link { filter: drop-shadow(4px 4px 0 #fff); }
      .link:hover { filter: drop-shadow(6px 6px 0 #fff); }
      h1 { font-size: 17px; }
      .ascii { font-size: 16px; }
    }
  </style>
</head>
<body>
  <main class="card pixel-corners">
    <pre class="ascii" aria-hidden="true">
   __________
  |   ____   |
  |  |    |  |
  |__|____|__|
     |    |
   __|____|__
  |  |    |  |
  |__|____|__|
     |    |
     |____|
    </pre>

    <h1>INDUKTO</h1>
    <p class="tagline">&gt; android apps &amp; open-source experiments<span class="cursor">▮</span></p>

    <nav class="links">
      <a class="link pixel-corners" href="https://play.google.com/store/apps/dev?id=YOUR_DEV_ID" target="_blank" rel="noopener">
        <span class="icon pixel-corners">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        </span>
        <span class="meta">
          <span class="name">GOOGLE PLAY</span>
          <span class="desc">browse all my apps</span>
        </span>
      </a>

      <a class="link pixel-corners" href="https://github.com/Indukto" target="_blank" rel="noopener">
        <span class="icon pixel-corners">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
          </svg>
        </span>
        <span class="meta">
          <span class="name">GITHUB</span>
          <span class="desc">check out my projects</span>
        </span>
      </a>
    </nav>

    <footer>© <span id="year">2026</span> indukto<span class="cursor">▮</span></footer>
  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
