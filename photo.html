<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>indukto — Photography</title>
  <meta name="description" content="indukto — photography." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='black'/%3E%3Cpath d='M56 12 L26 56 h18 l-6 32 30-44 h-18 z' fill='white'/%3E%3C/svg%3E" />
  <style>
    @font-face {
      font-family: 'Press Start 2P';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('pressstart2p-latin-AFEC86997FDAF54AF1F59358FA2C1E2A0F1D04146EDAD18E5CD141D0384A7548.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    @font-face {
      font-family: 'VT323';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('vt323-latin-8DDBEBCC1048154132E1D78EB9B1F7850BCA1B7D857035CCF1CB4318EBC615B6.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    @font-face {
      font-family: 'LibreBarcode128';
      src: url('LibreBarcode128Text-Regular-3404E23FFC729AD909E6679973C0EE7D07F60E4140A13BBB03464DEC758D523F.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Bitcount Single';
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url('bitcount-single-latin-D8BEEC97BC60035CA483935B2B32F68601CB0CF7D752A23359E6E06AB1E0A9A8.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    @font-face {
      font-family: 'Bitcount Single';
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url('bitcount-single-latinext-C7DF6264B9B3A7CF39C5C8E6518053AE38688A32678608229048B17161F210A8.woff2') format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }

    :root {
      --pixel: "Press Start 2P", "Courier New", monospace;
      --term: "VT323", "Courier New", monospace;
      --bitcount: "Bitcount Single", monospace;
      --barcode: "LibreBarcode128", monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--bitcount);
      background-color: #000;
      color: #fff;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* the photo itself, used directly as the background */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #000 no-repeat center / cover;
      background-image: url('photos/halftone-B2743C94BEC2A67431D558EDC145566E1E2485CEF0977A56A862356A1AFE17B7.avif');
      filter: grayscale(1) contrast(1.1) brightness(1.05);
      pointer-events: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, transparent 50%, rgba(0,0,0,0.4) 100%);
      z-index: 0;
      pointer-events: none;
    }

    /* CRT scanlines over everything */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 5;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.035) 0px,
        rgba(255,255,255,0.035) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 1060px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      font-family: var(--term);
      font-size: 22px;
      letter-spacing: 1px;
      color: #9a9a9a;
      text-shadow: 0 0 9px rgba(255, 255, 255, 0.3);
      margin-bottom: 2.5rem;
    }

    .topbar .brand {
      font-family: var(--barcode);
      font-size: 44px;
      line-height: 1;
      color: #fff;
      text-shadow: 0 0 18px rgba(255, 255, 255, 0.35);
      letter-spacing: 4px;
      text-decoration: none;
    }

    .topbar .page-num { color: #5c5c5c; }

    .topbar a.pagenav { text-decoration: none; }

    .topbar a.pagenav .page-num { transition: color 0.15s ease; }

    .topbar a.pagenav:hover .page-num { color: #fff; }

    .topbar a.back {
      font-family: var(--bitcount);
      font-size: 16px;
      letter-spacing: 1px;
      color: #fff;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 10px;
      padding: 0.5rem 0.9rem;
      transition: background-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }

    .topbar a.back:hover {
      background: #fff;
      color: #000;
      box-shadow: 0 0 20px rgba(255,255,255,0.35);
    }

    /* photo grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .shot {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.14);
      background: #000;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }

    .shot img {
      width: 100%;
      height: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
    }

    .shot { cursor: zoom-in; }

    .empty-note {
      grid-column: 1 / -1;
      font-family: var(--term);
      font-size: 22px;
      color: #7a7a7a;
      text-align: center;
      padding: 3rem 1rem;
      text-shadow: 0 0 9px rgba(255, 255, 255, 0.25);
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: rgba(0, 0, 0, 0);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
      opacity: 0;
      visibility: hidden;
      transition: background-color 0.3s ease, opacity 0.3s ease;
    }

    .lightbox.open {
      background: rgba(0, 0, 0, 0.92);
      opacity: 1;
      visibility: visible;
    }

    .lightbox img {
      max-width: 92vw;
      max-height: 92vh;
      object-fit: contain;
      transform: scale(0.5);
      opacity: 0;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .lightbox.open img {
      transform: scale(1);
      opacity: 1;
    }

    footer {
      text-align: center;
      font-family: var(--bitcount);
      font-size: 18px;
      line-height: 1.6;
      color: #7a7a7a;
      letter-spacing: 1px;
      text-shadow: 0 0 9px rgba(255, 255, 255, 0.28);
    }

    footer .ver { color: #5c5c5c; }

    @media (max-width: 480px) {
      .page { padding: 1.25rem 1rem 3rem; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <div class="page">
    <nav class="topbar">
      <a class="brand" href="index.html" aria-label="indukto — back to index">indukto</a>
      <span><a class="pagenav" href="index.html"><span class="page-num">// 01 dev</span></a> &nbsp;·&nbsp; <a class="pagenav" href="photo.html"><span class="page-num">// 02 photo</span></a></span>
      <a class="back" href="index.html">← back to index</a>
    </nav>

    <section class="grid" id="gallery" aria-label="Photo gallery"></section>

    <footer>© <span id="year">2026</span> indukto</footer>
  </div>

  <div class="lightbox" id="lightbox" role="dialog" aria-label="Enlarged photo">
    <img src="" alt="" />
  </div>

  <script src="photos.js"></script>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    // Gallery is rendered from the photos.js manifest, which is generated
    // from the photos/ folder by:  node build-gallery.mjs
    const grid = document.getElementById("gallery");
    const photos = window.PHOTOS || [];

    if (photos.length === 0) {
      const empty = document.createElement("p");
      empty.className = "empty-note";
      empty.textContent = "no photos yet — drop them into /photos and run node build-gallery.mjs";
      grid.appendChild(empty);
    } else {
      photos.forEach((src, i) => {
        const fig = document.createElement("figure");
        fig.className = "shot";

        const img = document.createElement("img");
        img.src = "photos/" + src;
        img.alt = "Photo " + String(i + 1).padStart(2, "0");
        if (i > 0) img.loading = "lazy";
        fig.appendChild(img);

        grid.appendChild(fig);
      });
    }

    const lightbox = document.getElementById("lightbox");
    const lbImg = lightbox.querySelector("img");

    grid.addEventListener("click", e => {
      const img = e.target.closest(".shot img");
      if (!img) return;
      lbImg.src = img.currentSrc || img.src;
      lbImg.alt = img.alt;
      lightbox.classList.add("open");
    });

    function closeLightbox() {
      lightbox.classList.remove("open");
      lbImg.src = "";
    }

    lightbox.addEventListener("click", closeLightbox);
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") closeLightbox();
    });
  </script>
</body>
</html>
