<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>indukto — Photography</title>
  <meta name="description" content="indukto — photography: grain, halftone &amp; liminal experiments." />
  <link rel="canonical" href="https://indukto.eu/photo.html" />
  <link rel="alternate" type="text/markdown" href="/photo.md" title="Markdown version" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    @font-face {
      font-family: 'VT323';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('vt323-latin-8DDBEBCC1048154132E1D78EB9B1F7850BCA1B7D857035CCF1CB4318EBC615B6.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    @font-face {
      font-family: 'LibreBarcode128';
      src: url('LibreBarcode128Text-Regular-3404E23FFC729AD909E6679973C0EE7D07F60E4140A13BBB03464DEC758D523F.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Bitcount Single';
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url('bitcount-single-latin-D8BEEC97BC60035CA483935B2B32F68601CB0CF7D752A23359E6E06AB1E0A9A8.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    @font-face {
      font-family: 'Bitcount Single';
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url('bitcount-single-latinext-C7DF6264B9B3A7CF39C5C8E6518053AE38688A32678608229048B17161F210A8.woff2') format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }

    :root {
      --ink: #0b0b0b;
      --paper: #e8e6e1;
      --dim: #8c8a85;
      --line: rgba(232, 230, 225, 0.16);
      --barcode: "LibreBarcode128", "Courier New", monospace;
      --term: "VT323", "Courier New", monospace;
      --bitcount: "Bitcount Single", monospace;
      --gutter: clamp(1rem, 4vw, 2.5rem);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--bitcount);
      background: var(--ink);
      color: var(--paper);
      line-height: 1.5;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    a, button { touch-action: manipulation; }

    ::selection { background: var(--paper); color: var(--ink); }

    a:focus-visible,
    .shot:focus-visible {
      outline: 2px dashed var(--paper);
      outline-offset: 4px;
    }

    /* --- background: halftone photo, darkened, with scanlines ------------- */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #000 url('photos/halftone-B2743C94BEC2A67431D558EDC145566E1E2485CEF0977A56A862356A1AFE17B7.avif') center / cover no-repeat;
      filter: grayscale(1) contrast(1.15) brightness(0.65);
      opacity: 0.32;
      pointer-events: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      background: radial-gradient(120% 85% at 50% 0%, rgba(0, 0, 0, 0.25) 0%, rgba(0, 0, 0, 0.92) 68%, #000 100%);
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 9;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.035) 0px,
        rgba(255, 255, 255, 0.035) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
    }

    /* --- layout ---------------------------------------------------------- */
    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1140px;
      margin: 0 auto;
      padding-left: var(--gutter);
      padding-right: var(--gutter);
    }

    /* --- top bar --------------------------------------------------------- */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 8;
      background: rgba(11, 11, 11, 0.82);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.25rem;
      padding-top: 0.55rem;
      padding-bottom: 0.55rem;
    }

    .wordmark {
      font-family: var(--barcode);
      font-size: 38px;
      line-height: 1;
      letter-spacing: 4px;
      color: var(--paper);
      text-decoration: none;
      padding-top: 0.3rem;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 1.4rem;
      font-family: var(--term);
      font-size: 20px;
      letter-spacing: 0.09em;
    }

    .nav a {
      color: var(--dim);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .nav a:hover,
    .nav a[aria-current="page"] { color: var(--paper); }

    /* --- page head ------------------------------------------------------- */
    .page-head { padding-top: clamp(2.5rem, 7vh, 4.5rem); }

    .block-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem 1.5rem;
      flex-wrap: wrap;
      margin-bottom: clamp(1rem, 2.5vw, 1.5rem);
      padding-bottom: clamp(1rem, 2.5vw, 1.5rem);
      border-bottom: 1px solid var(--line);
    }

    .block-head h1 {
      font-family: var(--barcode);
      font-weight: 400;
      font-size: clamp(38px, 6vw, 70px);
      line-height: 1.2;
      letter-spacing: 0.04em;
      color: var(--paper);
    }

    .block-head .idx {
      font-family: var(--term);
      font-size: 20px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--dim);
    }

    .intro {
      max-width: 56ch;
      margin-bottom: clamp(2rem, 5vw, 3.5rem);
      font-family: var(--term);
      font-size: 20px;
      line-height: 1.5;
      letter-spacing: 0.04em;
      color: var(--dim);
    }

    .intro a {
      color: var(--paper);
      text-decoration: none;
      border-bottom: 1px solid var(--line);
      transition: border-color 0.15s ease;
    }

    .intro a:hover { border-color: var(--paper); }

    /* --- plates: asymmetric editorial grid ------------------------------- */
    .sheet {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: clamp(1.25rem, 3vw, 2.5rem);
      align-items: start;
    }

    .shot {
      grid-column: span 6;
      margin: 0;
      line-height: 0;
      cursor: zoom-in;
    }

    .shot:nth-child(1) { grid-column: span 8; }
    .shot:nth-child(2) { grid-column: span 4; margin-top: clamp(1.5rem, 5vw, 4rem); }
    .shot:nth-child(3) { grid-column: span 5; }
    .shot:nth-child(4) { grid-column: span 7; }
    .shot:nth-child(5) { grid-column: span 6; }
    .shot:nth-child(6) { grid-column: span 6; margin-top: clamp(1rem, 3vw, 2rem); }

    .shot .frame {
      display: block;
      width: 100%;
      overflow: hidden;
      background: #000;
      border: 1px solid var(--line);
      line-height: 0;
    }

    .shot img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      filter: grayscale(1) contrast(1.06);
      transition: filter 0.35s ease, transform 0.5s ease;
    }

    .shot:nth-child(2) img { aspect-ratio: 3 / 4; }
    .shot:nth-child(3) img { aspect-ratio: 4 / 5; }
    .shot:nth-child(4) img { aspect-ratio: 16 / 10; }
    .shot:nth-child(5) img { aspect-ratio: 4 / 3; }
    .shot:nth-child(6) img { aspect-ratio: 1 / 1; }

    .shot:hover img {
      filter: grayscale(1) contrast(1.12) brightness(1.05);
      transform: scale(1.015);
    }

    .shot figcaption {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem 1rem;
      margin-top: 0.7rem;
      padding-top: 0.55rem;
      border-top: 1px solid var(--line);
      font-family: var(--term);
      font-size: 17px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      line-height: 1.3;
      color: var(--dim);
    }

    .shot figcaption .no {
      color: var(--paper);
      flex: none;
    }

    .shot figcaption .title {
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .shot:hover figcaption .title { color: var(--paper); }

    .empty-note {
      grid-column: 1 / -1;
      font-family: var(--term);
      font-size: 22px;
      color: var(--dim);
      text-align: center;
      padding: 3rem 1rem;
      letter-spacing: 0.04em;
      line-height: 1.5;
    }

    /* --- lightbox -------------------------------------------------------- */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0);
      cursor: zoom-out;
      opacity: 0;
      visibility: hidden;
      touch-action: none;
      transition: background-color 0.3s ease, opacity 0.3s ease;
    }

    .lightbox.open {
      background: rgba(0, 0, 0, 0.96);
      opacity: 1;
      visibility: visible;
    }

    .lb-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.9rem;
      max-width: 92vw;
      margin: 0;
      line-height: 0;
    }

    .lift {
      display: block;
    }

    .lift img {
      display: block;
      max-width: 92vw;
      max-height: 82vh;
      object-fit: contain;
      border: 1px solid rgba(232, 230, 225, 0.2);
      transform: scale(0.97);
      opacity: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .lightbox.open .lift img {
      transform: scale(1);
      opacity: 1;
    }

    .lb-caption {
      display: flex;
      align-items: baseline;
      gap: 0.6rem 1.25rem;
      flex-wrap: wrap;
      justify-content: center;
      font-family: var(--term);
      font-size: 18px;
      line-height: 1.3;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--dim);
    }

    .lb-caption .no { color: var(--paper); }

    .lb-close {
      position: fixed;
      top: calc(0.9rem + env(safe-area-inset-top));
      right: calc(0.9rem + env(safe-area-inset-right));
      z-index: 21;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(11, 11, 11, 0.7);
      color: var(--paper);
      border: 1px solid var(--line);
      font-family: var(--term);
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .lb-btn {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      z-index: 21;
      width: 44px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(11, 11, 11, 0.7);
      color: var(--paper);
      border: 1px solid var(--line);
      font-family: var(--term);
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .lb-btn:hover,
    .lb-close:hover {
      background: var(--paper);
      color: var(--ink);
      border-color: var(--paper);
    }

    .lb-btn.prev { left: 0.75rem; }
    .lb-btn.next { right: 0.75rem; }

    /* --- footer ---------------------------------------------------------- */
    footer {
      position: relative;
      z-index: 1;
      border-top: 1px solid var(--line);
      padding-top: 1.75rem;
      padding-bottom: clamp(2rem, 5vh, 3rem);
      margin-top: clamp(3.5rem, 9vh, 6rem);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem 2rem;
      font-family: var(--term);
      font-size: 18px;
      letter-spacing: 0.08em;
      color: var(--dim);
    }

    footer a {
      color: var(--dim);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    footer a:hover {
      color: var(--paper);
      border-color: var(--line);
    }

    footer .mark {
      font-family: var(--barcode);
      font-size: 26px;
      letter-spacing: 0.08em;
      color: rgba(232, 230, 225, 0.55);
    }

    .foot-links { display: flex; gap: 1.25rem; flex-wrap: wrap; }

    /* --- responsive ------------------------------------------------------ */
    @media (max-width: 860px) {
      .sheet { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .shot,
      .shot:nth-child(n) { grid-column: auto; margin-top: 0; }
      .shot img,
      .shot:nth-child(n) img { aspect-ratio: 4 / 3; }
    }

    @media (max-width: 560px) {
      .wordmark { font-size: 30px; letter-spacing: 3px; }
      .nav { font-size: 17px; gap: 1rem; }
      .nav .hide-sm { display: none; }
      .block-head h1 { font-size: 34px; }
      .block-head .idx { font-size: 17px; }
      .intro { font-size: 18px; }
      .sheet { grid-template-columns: 1fr; }
      .shot figcaption { font-size: 15px; }
      .lb-btn { width: 38px; height: 56px; font-size: 24px; }
      .lb-caption { font-size: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .shot img, .lightbox, .lift img, .lb-btn, .lb-close, .nav a { transition: none; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <header class="topbar">
    <div class="topbar-inner wrap">
      <a class="wordmark" href="index.html" aria-label="indukto — home">indukto</a>
      <nav class="nav" aria-label="Sections">
        <a href="index.html#app">// app</a>
        <a href="index.html#work">// work</a>
        <a href="photo.html" aria-current="page">// photography</a>
        <a href="privacy.html" class="hide-sm">// privacy</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <div class="page-head">
      <div class="block-head">
        <h1>PHOTOGRAPHY</h1>
        <span class="idx">// 03 — archive</span>
      </div>
      <p class="intro">
        grain, halftone &amp; liminal experiments — <span id="count">0</span> frames, shot on
        whatever was in my pocket. click any plate to enlarge, or
        <a href="index.html">back to the index</a>.
      </p>
    </div>

    <section class="sheet" id="gallery" aria-label="Photo gallery"></section>
  </main>

  <footer class="wrap">
    <span>© <span id="year">2026</span> indukto</span>
    <span class="mark" aria-hidden="true">INDUKTO</span>
    <span class="foot-links">
      <a href="https://play.google.com/store/apps/details?id=eu.indukto.zoombox" target="_blank" rel="noopener">ZoomBox on Google Play</a>
      <a href="privacy.html">privacy</a>
      <a href="photo.md">markdown</a>
    </span>
  </footer>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Enlarged photo">
    <button class="lb-close" id="lb-close" aria-label="Close">×</button>
    <figure class="lb-stage">
      <span class="lift"><img src="" alt="" /></span>
      <figcaption class="lb-caption" id="lb-caption" aria-live="polite"></figcaption>
    </figure>
    <button class="lb-btn prev" id="lb-prev" aria-label="Previous photo">‹</button>
    <button class="lb-btn next" id="lb-next" aria-label="Next photo">›</button>
  </div>

  <script src="photos.js"></script>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    // Gallery is rendered from the photos.js manifest, generated from the
    // photos/ folder by:  node build-gallery.mjs
    const grid = document.getElementById("gallery");
    const photos = window.PHOTOS || [];
    const pad = n => String(n).padStart(2, "0");

    // "liminal-halftone2-HASH.avif" → "liminal halftone 2"
    function titleOf(src) {
      return src
        .replace(/\.[^.]+$/, "")
        .split("-")
        .slice(0, -1)
        .join(" ")
        .replace(/([a-z])(\d)/g, "$1 $2")
        .trim();
    }

    const tiles = [];
    document.getElementById("count").textContent = photos.length;

    if (photos.length === 0) {
      const empty = document.createElement("p");
      empty.className = "empty-note";
      empty.textContent = "no photos yet — drop them into /photos and run node build-gallery.mjs";
      grid.appendChild(empty);
    } else {
      photos.forEach((src, i) => {
        const fig = document.createElement("figure");
        fig.className = "shot";
        fig.tabIndex = 0;
        fig.setAttribute("role", "button");
        fig.setAttribute("aria-label", "Enlarge photo " + pad(i + 1) + ": " + titleOf(src));

        const frame = document.createElement("span");
        frame.className = "frame";

        const img = document.createElement("img");
        img.src = "photos/" + src;
        img.alt = "Photo " + pad(i + 1) + " — " + titleOf(src);
        if (i > 0) img.loading = "lazy";
        img.decoding = "async";
        frame.appendChild(img);

        const cap = document.createElement("figcaption");
        const no = document.createElement("span");
        no.className = "no";
        no.textContent = pad(i + 1);
        const title = document.createElement("span");
        title.className = "title";
        title.textContent = titleOf(src);
        cap.append(no, title);

        fig.append(frame, cap);
        grid.appendChild(fig);
        tiles.push({ fig, img, title: titleOf(src) });
      });
    }

    const lightbox = document.getElementById("lightbox");
    const lbImg = lightbox.querySelector("img");
    const lbCaption = document.getElementById("lb-caption");
    const lbPrev = document.getElementById("lb-prev");
    const lbNext = document.getElementById("lb-next");
    const lbClose = document.getElementById("lb-close");
    let current = 0;
    let lastFocus = null;
    let touchX = null;
    let touchY = null;

    function showPhoto(index) {
      if (tiles.length === 0) return;
      current = (index + tiles.length) % tiles.length;
      const tile = tiles[current];
      lbImg.src = tile.img.currentSrc || tile.img.src;
      lbImg.alt = tile.img.alt;

      const no = document.createElement("span");
      no.className = "no";
      no.textContent = pad(current + 1) + " / " + pad(tiles.length);
      const title = document.createElement("span");
      title.textContent = tile.title;
      lbCaption.replaceChildren(no, title);

      const single = tiles.length < 2;
      lbPrev.style.visibility = single ? "hidden" : "visible";
      lbNext.style.visibility = single ? "hidden" : "visible";
    }

    function openLightbox(index) {
      lastFocus = document.activeElement;
      showPhoto(index);
      lightbox.classList.add("open");
      lbClose.focus({ preventScroll: true });
    }

    function closeLightbox() {
      lightbox.classList.remove("open");
      lbImg.src = "";
      if (lastFocus && lastFocus.isConnected) lastFocus.focus({ preventScroll: true });
    }

    function navPhoto(delta) {
      if (!lightbox.classList.contains("open")) return;
      showPhoto(current + delta);
    }

    grid.addEventListener("click", e => {
      const fig = e.target.closest(".shot");
      if (!fig) return;
      openLightbox(tiles.findIndex(t => t.fig === fig));
    });

    grid.addEventListener("keydown", e => {
      if (e.key !== "Enter" && e.key !== " ") return;
      const fig = e.target.closest(".shot");
      if (!fig) return;
      e.preventDefault();
      openLightbox(tiles.findIndex(t => t.fig === fig));
    });

    lbPrev.addEventListener("click", e => { e.stopPropagation(); navPhoto(-1); });
    lbNext.addEventListener("click", e => { e.stopPropagation(); navPhoto(1); });
    lbClose.addEventListener("click", e => { e.stopPropagation(); closeLightbox(); });
    lightbox.addEventListener("click", e => {
      if (e.target === lightbox) closeLightbox();
    });

    document.addEventListener("keydown", e => {
      if (!lightbox.classList.contains("open")) return;
      if (e.key === "Escape") closeLightbox();
      else if (e.key === "ArrowLeft") navPhoto(-1);
      else if (e.key === "ArrowRight") navPhoto(1);
    });

    // touch: swipe left/right to browse, swipe down to close
    lightbox.addEventListener("touchstart", e => {
      touchX = e.changedTouches[0].clientX;
      touchY = e.changedTouches[0].clientY;
    }, { passive: true });

    lightbox.addEventListener("touchend", e => {
      if (touchX === null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      const dy = e.changedTouches[0].clientY - touchY;
      touchX = touchY = null;
      if (Math.abs(dx) < 40 && Math.abs(dy) < 40) return; // tap, handled by click
      if (Math.abs(dy) > Math.abs(dx)) {
        if (dy > 60) closeLightbox(); // swipe down to close
      } else if (dx < -40) {
        navPhoto(1); // swipe left → next
      } else if (dx > 40) {
        navPhoto(-1); // swipe right → previous
      }
    }, { passive: true });
  </script>
</body>
</html>
