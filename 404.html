<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>404 — not found · indukto</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    @font-face {
      font-family: 'VT323';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('vt323-latin-8DDBEBCC1048154132E1D78EB9B1F7850BCA1B7D857035CCF1CB4318EBC615B6.woff2') format('woff2');
    }
    @font-face {
      font-family: 'LibreBarcode128';
      src: url('LibreBarcode128Text-Regular-3404E23FFC729AD909E6679973C0EE7D07F60E4140A13BBB03464DEC758D523F.ttf') format('truetype');
      font-weight: normal;
      font-display: swap;
    }
    :root {
      --ink: #0b0b0b;
      --paper: #e8e6e1;
      --dim: #8c8a85;
      --line: rgba(232, 230, 225, 0.16);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--ink);
      color: var(--paper);
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 2rem 1.25rem;
      font-family: 'VT323', 'Courier New', monospace;
      line-height: 1.5;
      -webkit-text-size-adjust: 100%;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 9;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.035) 0px,
        rgba(255, 255, 255, 0.035) 1px,
        transparent 1px,
        transparent 3px
      );
    }
    .idx {
      color: var(--dim);
      font-size: 20px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    .code {
      font-family: 'LibreBarcode128', monospace;
      font-size: clamp(76px, 24vw, 170px);
      line-height: 1;
      letter-spacing: 0.06em;
    }
    p.msg {
      color: var(--dim);
      font-size: 22px;
      max-width: 48ch;
      margin: 1.5rem auto 2.25rem;
    }
    nav {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
      font-size: 21px;
      letter-spacing: 0.05em;
    }
    nav a {
      color: var(--paper);
      text-decoration: none;
      border-bottom: 1px solid var(--line);
      transition: border-color 0.15s ease;
    }
    nav a:hover { border-color: var(--paper); }
    a:focus-visible { outline: 2px dashed var(--paper); outline-offset: 3px; }
    @media (max-width: 480px) {
      nav { gap: 1rem; font-size: 18px; }
      p.msg { font-size: 19px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="idx">// error — file not found</p>
    <div class="code" aria-hidden="true">404</div>
    <p class="msg">
      this address does not exist — it may have moved, or the link is stale.
      no trackers, no tricks: just a wrong door.
    </p>
    <nav aria-label="Back to the site">
      <a href="/">// home</a>
      <a href="/photo.html">// photography</a>
      <a href="/privacy.html">// privacy</a>
      <a href="/api.html">// api</a>
    </nav>
  </main>
</body>
</html>
