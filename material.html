<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>indukto — Apps &amp; Code</title>
  <meta name="description" content="indukto — Android apps on Google Play and open-source projects on GitHub." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%236750A4'/%3E%3Cpath d='M56 12 L26 56 h18 l-6 32 30-44 h-18 z' fill='white'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- Material 3 color tokens (light, purple seed) -->
  <style>
    :root {
      --md-primary: #6750A4;
      --md-on-primary: #FFFFFF;
      --md-primary-container: #EADDFF;
      --md-on-primary-container: #21005D;
      --md-secondary-container: #E8DEF8;
      --md-on-secondary-container: #1D192B;
      --md-tertiary-container: #D8E2FF;
      --md-surface: #FEF7FF;
      --md-surface-container-low: #F7F2FA;
      --md-surface-container-highest: #E6E0E9;
      --md-on-surface: #1D1B20;
      --md-on-surface-variant: #49454F;
      --md-outline-variant: #CAC4D0;
      --md-elevation-1: 0 1px 2px rgba(0, 0, 0, 0.30), 0 1px 3px 1px rgba(0, 0, 0, 0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--md-surface);
      color: var(--md-on-surface);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      position: relative;
      overflow: hidden;
    }

    /* Monet-style color blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.5;
      z-index: 0;
      pointer-events: none;
    }
    .blob-1 { width: 360px; height: 360px; background: var(--md-primary-container); top: -120px; right: -80px; }
    .blob-2 { width: 320px; height: 320px; background: var(--md-secondary-container); bottom: -120px; left: -80px; }
    .blob-3 { width: 240px; height: 240px; background: var(--md-tertiary-container); top: 35%; left: -140px; }

    main {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: var(--md-primary-container);
      color: var(--md-on-primary-container);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: var(--md-elevation-1);
    }

    .avatar svg {
      width: 44px;
      height: 44px;
      fill: var(--md-on-primary-container);
    }

    h1 {
      font-size: 24px;
      font-weight: 400;
      letter-spacing: 0.1px;
      color: var(--md-on-surface);
    }

    .tagline {
      font-size: 14px;
      font-weight: 400;
      line-height: 1.4;
      color: var(--md-on-surface-variant);
      margin: 8px 0 32px;
    }

    .card {
      background: var(--md-surface-container-low);
      border-radius: 24px;
      box-shadow: var(--md-elevation-1);
      padding: 8px;
      text-align: left;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 16px;
      text-decoration: none;
      color: inherit;
      padding: 14px 16px;
      border-radius: 16px;
      transition: background-color 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    /* Material state layers */
    .row:hover { background-color: rgba(29, 27, 32, 0.08); }
    .row:active { background-color: rgba(29, 27, 32, 0.12); }

    .leading-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--md-secondary-container);
      color: var(--md-on-secondary-container);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .leading-icon svg {
      width: 20px;
      height: 20px;
      fill: var(--md-on-secondary-container);
    }

    .material-symbols-rounded {
      font-family: "Material Symbols Rounded";
      font-weight: normal;
      font-style: normal;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      font-variation-settings: "FILL" 1, "wght" 400, "GRAD" 0, "opsz" 24;
    }

    .leading-icon .material-symbols-rounded { font-size: 22px; }

    .row-text { flex: 1; min-width: 0; }

    .row-title {
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.1px;
      display: block;
      color: var(--md-on-surface);
    }

    .row-subtitle {
      font-size: 14px;
      font-weight: 400;
      color: var(--md-on-surface-variant);
      display: block;
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chevron {
      font-size: 20px;
      color: var(--md-on-surface-variant);
      flex-shrink: 0;
    }

    .divider {
      height: 1px;
      background: var(--md-outline-variant);
      margin: 0 16px;
      opacity: 0.6;
    }

    footer {
      margin-top: 24px;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.4px;
      color: var(--md-on-surface-variant);
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <main>
    <div class="avatar">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M11 1 L4 11 H8 L6 15 L12 6 H9 Z"/>
      </svg>
    </div>

    <h1>indukto</h1>
    <p class="tagline">Android apps &amp; open-source experiments</p>

    <div class="card">
      <a class="row" href="https://play.google.com/store/apps/dev?id=YOUR_DEV_ID" target="_blank" rel="noopener">
        <span class="leading-icon">
          <span class="material-symbols-rounded" aria-hidden="true">play_arrow</span>
        </span>
        <span class="row-text">
          <span class="row-title">Google Play</span>
          <span class="row-subtitle">Browse all my apps</span>
        </span>
        <span class="material-symbols-rounded chevron" aria-hidden="true">chevron_right</span>
      </a>

      <div class="divider" role="separator"></div>

      <a class="row" href="https://github.com/Indukto" target="_blank" rel="noopener">
        <span class="leading-icon">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
          </svg>
        </span>
        <span class="row-text">
          <span class="row-title">GitHub</span>
          <span class="row-subtitle">Check out my projects</span>
        </span>
        <span class="material-symbols-rounded chevron" aria-hidden="true">chevron_right</span>
      </a>
    </div>

    <footer>© <span id="year"></span> indukto</footer>
  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
